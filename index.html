<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning des Colles</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 30px;
      background: #eef;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recherche de Colles MPSI-3</h1>
    <div class="form-group">
      <label for="groupe">Groupe</label>
      <select id="groupe">
        <option value="">-- Choisir un groupe --</option>
        <option value="1">G1</option>
        <option value="2">G2</option>
        <option value="3">G3</option>
        <option value="4">G4</option>
        <option value="5">G5</option>
        <option value="6">G6</option>
        <option value="7">G7</option>
        <option value="8">G8</option>
        <option value="9">G9</option>
        <option value="10">G10</option>
        <option value="11">G11</option>
        <option value="12">G12</option>
      </select>
    </div>
    <div class="form-group">
      <label for="semaine">Semaine</label>
      <select id="semaine">
        <option value="">-- Choisir une semaine --</option>
        <option value="1">Semaine 1 : du 31 mars 2025 au 6 avril 2025</option>
        <option value="2">Semaine 2 : du 7 avril 2025 au 13 avril 2025</option>
        <option value="3">Semaine 3 : du 14 avril 2025 au 20 avril 2025</option>
        <option value="4">Semaine 4 : du 21 avril 2025 au 27 avril 2025</option>
        <option value="5">Semaine 5 : du 28 avril 2025 au 4 mai 2025</option>
        <option value="6">Semaine 6 : du 5 mai 2025 au 11 mai 2025</option>
        <option value="7">Semaine 7 : du 12 mai 2025 au 18 mai 2025</option>
        <option value="8">Semaine 8 : du 19 mai 2025 au 25 mai 2025</option>
        <option value="9">Semaine 9 : du 26 mai 2025 au 1 juin 2025</option>
        <option value="10">Semaine 10 : du 2 juin 2025 au 8 juin 2025</option>
        <option value="11">Semaine 11 : du 9 juin 2025 au 15 juin 2025</option>
        <option value="12">Semaine 12 : du 16 juin 2025 au 22 juin 2025</option>
      </select>
    </div>
    <button onclick="rechercherColle()">Afficher les colles</button>
    <div id="resultat" class="result"></div>
  </div>

  <script>
    const planning = [
      null,
      { MATHS: ['Lundi', '12h30-13h30'], ANG: ['Jeudi', '13h30-14h30'], FR: null },
      { PC: ['Mardi', '12h30-13h30'], CHIMIE: ['Vendredi', '16h30-17h30'], FR: ['Jeudi', '13h30-14h30'] },
      { MATHS: null, ANG: ['Mercredi', '13h30-14h30'], FR: null },
      { PC: ['Vendredi', '16h30-17h30'], ANG: null, FR: ['Jeudi', '12h30-13h30'] },
      { MATHS: ['Lundi', '13h30-14h30'], ANG: ['Mercredi', '13h30-14h30'], FR: null },
      { PC: ['Jeudi', '13h30-14h30'], CHIMIE: ['Vendredi', '18h30-19h30'], FR: ['Mercredi', '18h30-19h30'] },
      { MATHS: null, ANG: ['Jeudi', '13h30-14h30'], FR: null },
      { PC: ['Vendredi', '17h30-18h30'], ANG: null, FR: ['Jeudi', '13h30-14h30'] },
      { MATHS: ['Vendredi', '16h30-17h30'], ANG: ['Mercredi', '13h30-14h30'], FR: null },
      { PC: ['Mardi', '13h30-14h30'], ANG: null, FR: ['Jeudi', '12h30-13h30'] },
      { MATHS: null, ANG: ['Jeudi', '13h30-14h30'], FR: null },
      { PC: ['Jeudi', '12h30-13h30'], FR: ['Mercredi', '18h30-19h30'] }
    ];

    function rechercherColle() {
      const g = parseInt(document.getElementById("groupe").value);
      const s = parseInt(document.getElementById("semaine").value);
      const resultat = document.getElementById("resultat");
      if (!g || !s) {
        resultat.innerHTML = '<strong>Veuillez sélectionner un groupe et une semaine.</strong>';
        return;
      }

      const index = ((g + s - 2) % 12) + 1;
      const colles = planning[index];

      let html = `<h3>Colles pour le Groupe G${g}, Semaine ${s} :</h3><ul>`;
      for (const [matiere, info] of Object.entries(colles)) {
        if (info) {
          html += `<li><strong>${matiere}</strong> : ${info[0]}, ${info[1]}</li>`;
        }
      }
      html += '</ul>';
      resultat.innerHTML = html;
    }
  </script>
</body>
</html>
